<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>GameZone - Panel de Ventas</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e3a8a; color: white; margin: 0; padding: 20px; }
        /* Header actualizado para alinear el buscador */
        .header { background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        .container { display: flex; gap: 20px; }
        .sidebar { background: #1e293b; width: 220px; padding: 15px; border-radius: 8px; }
        .main { flex-grow: 1; background: #1e293b; padding: 20px; border-radius: 8px; }
        .btn { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin: 4px 0; display: block; width: 100%; }
        .btn:hover { background: #2563eb; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: #0f172a; padding: 15px; border-radius: 8px; border: 1px solid #60a5fa; }
        
        /* NUEVO: Clase de CSS para recortar imágenes a la medida (El truco object-fit) */
        .img-juego { width: 100%; height: 160px; object-fit: cover; border-radius: 5px; margin-bottom: 10px; background-color: #1e293b; }
    </style>
</head>
<body>

    <!-- BARRA SUPERIOR CON BUSCADOR -->
    <div class="header">
        <h2 style="margin: 0;">🎮 GameZone - Plataforma de Ventas</h2>
        <div style="display: flex; gap: 10px; align-items: center;">
            <input type="text" id="buscador" placeholder="Buscar videojuego..." style="padding: 6px; border-radius: 4px; border: none; background: #1e293b; color: white;">
            <button class="btn" style="margin: 0; width: auto;" onclick="buscarJuego()">Buscar</button>
            <span style="margin-left: 15px;">Perfil: Admin / Developer</span>
        </div>
    </div>

    <div class="container">
        <!-- MENÚ LATERAL (FILTROS) -->
        <div class="sidebar">
            <h3>Categorías</h3>
            <button class="btn" onclick="cargarJuegos('')">Todos</button>
            <button class="btn" onclick="cargarJuegos('RPG')">RPG</button>
            <button class="btn" onclick="cargarJuegos('Deportes')">Deportes</button>
            <button class="btn" onclick="cargarJuegos('Accion')">Acción</button>
        </div>

        <!-- ÁREA CENTRAL (VISTA Y CATÁLOGO) -->
        <div class="main">
            <h3>Catálogo de Videojuegos</h3>
            <div id="catalogo" class="grid">Cargando datos del servidor...</div>
        </div>
    </div>

    <script>
        // NUEVO: Variable para guardar los datos y que el buscador funcione súper rápido
        let juegosGlobales = [];

        async function cargarJuegos(categoria = '') {
            const url = categoria ? `/api/juegos?categoria=${encodeURIComponent(categoria)}` : '/api/juegos';
            const contenedor = document.getElementById('catalogo');
            contenedor.textContent = 'Cargando datos del servidor...';

            try {
                const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
                const datos = await response.json();
                if (!response.ok) throw new Error(datos.message || 'Error al cargar');
                
                juegosGlobales = datos; // Guardamos en memoria
                renderizarJuegos(juegosGlobales); // Llamamos a la función que pinta las tarjetas

            } catch (error) {
                contenedor.textContent = error.message;
            }
        }

        // NUEVO: Función separada para dibujar las tarjetas (necesaria para el buscador)
        function renderizarJuegos(datos) {
            const contenedor = document.getElementById('catalogo');
            contenedor.replaceChildren();

            if (datos.length === 0) {
                contenedor.textContent = 'No hay juegos disponibles.';
                return;
            }

            datos.forEach(juego => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'card';

                // NUEVO: Integración de la imagen de portada
                const img = document.createElement('img');
                img.className = 'img-juego';
                // Si la base de datos no tiene link de imagen, usa un placeholder elegante con el nombre del juego
                img.src = juego.imagen || `https://via.placeholder.com/300x160/1e293b/ffffff?text=${encodeURIComponent(juego.titulo)}`;
                img.alt = `Portada de ${juego.titulo}`;
                tarjeta.appendChild(img);

                const titulo = document.createElement('h4');
                titulo.textContent = juego.titulo;
                titulo.style.marginTop = "5px";
                tarjeta.appendChild(titulo);

                const detalles = [
                    ['Categoría', juego.categoria],
                    ['Precio', `$${juego.precio}`],
                    ['Stock', juego.stock],
                    ['Ventas', juego.ventas_totales]
                ];

                detalles.forEach(([etiqueta, valor]) => {
                    const parrafo = document.createElement('p');
                    parrafo.style.margin = "5px 0";
                    const fuerte = document.createElement('strong');
                    fuerte.textContent = `${etiqueta}: `;
                    parrafo.append(fuerte, document.createTextNode(String(valor)));
                    tarjeta.appendChild(parrafo);
                });

                const boton = document.createElement('button');
                boton.className = 'btn';
                boton.textContent = 'Comprar 1';
                boton.disabled = juego.stock < 1;
                boton.addEventListener('click', () => comprar(juego.id));
                tarjeta.appendChild(boton);

                contenedor.appendChild(tarjeta);
            });
        }

        // NUEVO: Función que ejecuta la barra de búsqueda en tiempo real
        function buscarJuego() {
            const textoBuscado = document.getElementById('buscador').value.toLowerCase();
            const juegosFiltrados = juegosGlobales.filter(juego => 
                juego.titulo.toLowerCase().includes(textoBuscado)
            );
            renderizarJuegos(juegosFiltrados);
        }

        async function comprar(juegoId) {
            try {
                const response = await fetch('/api/ventas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ juego_id: juegoId, cantidad: 1 })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'No fue posible registrar la venta');
                
                alert("✅ " + data.message);
                await cargarJuegos();
            } catch (error) {
                alert("❌ " + error.message);
            }
        }

        cargarJuegos();
    </script>
</body>
</html>
