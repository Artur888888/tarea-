<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Panel de Ventas</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; color: white; margin: 0; padding: 20px; }
        
        /* Header actualizado para alinear el buscador */
        .header { background: rgba(15, 23, 42, 0.9); padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .buscador-box { display: flex; gap: 10px; align-items: center; }
        .buscador-input { padding: 8px 10px; border-radius: 4px; border: 1px solid #334155; background: #1e293b; color: white; outline: none; }
        .buscador-input:focus { border-color: #60a5fa; }

        .container { display: flex; gap: 20px; align-items: flex-start; }
        .sidebar { background: rgba(30, 41, 59, 0.9); width: 210px; padding: 15px; border-radius: 8px; flex-shrink: 0; }
        .main { flex-grow: 1; background: rgba(30, 41, 59, 0.9); padding: 20px; border-radius: 8px; }

        .btn { background: #3b82f6; color: white; border: none; padding: 8px 12px; border-radius: 4px; cursor: pointer; margin: 4px 0; display: block; width: 100%; font-weight: bold; transition: background 0.2s; }
        .btn:hover:not(:disabled) { background: #2563eb; }
        .btn:disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }

        /* Tarjetas más compactas en el catálogo */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: #0f172a; padding: 12px; border-radius: 8px; border: 1px solid #60a5fa; display: flex; flex-direction: column; font-size: 14px; }
        .card h4 { margin: 6px 0; min-height: 36px; font-size: 15px; }
        .card .btn { margin-top: auto; }

        /* Portada compacta en catálogo con efecto al pasar el mouse */
        .img-juego { width: 100%; height: 220px; object-fit: cover; border-radius: 6px; margin-bottom: 8px; background-color: #1e293b; display: block; cursor: pointer; transition: transform 0.2s, border-color 0.2s; border: 1px solid transparent; }
        .img-juego:hover { transform: scale(1.03); border-color: #60a5fa; }

        /* Modal para ver la portada ampliada hasta su tamaño original (600x800 máx.) */
        .modal-fondo { display: none; position: fixed; inset: 0; background: rgba(2, 6, 23, 0.85); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
        .modal-fondo.activo { display: flex; }
        .modal-contenido { background: #0f172a; border: 1px solid #60a5fa; border-radius: 10px; padding: 20px; max-width: 92vw; max-height: 92vh; display: flex; gap: 20px; align-items: center; position: relative; flex-wrap: wrap; justify-content: center; }
        .modal-img { width: auto; height: auto; max-width: min(600px, 80vw); max-height: min(800px, 78vh); border-radius: 8px; display: block; object-fit: contain; }
        .modal-info { min-width: 220px; max-width: 280px; }
        .modal-cerrar { position: absolute; top: 10px; right: 12px; background: #ef4444; color: white; border: none; border-radius: 4px; padding: 4px 10px; font-weight: bold; cursor: pointer; }
        .modal-cerrar:hover { background: #dc2626; }
    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/fondo.css') }}">
</head>
<body>

    <!-- BARRA SUPERIOR CON BUSCADOR -->
    <div class="header">
        <h2 style="margin: 0;">🎮 GameZone - Plataforma de Ventas</h2>
        <div class="buscador-box">
            <input type="text" id="buscador" class="buscador-input" placeholder="Buscar videojuego..." oninput="buscarJuego()">
            <button class="btn" style="margin: 0; width: auto;" onclick="buscarJuego()">Buscar</button>
            <span style="margin-left: 10px;">Perfil: Admin / Developer</span>
        </div>
    </div>

    <div class="container">
        <!-- MENÚ LATERAL (FILTROS) -->
        <div class="sidebar">
            <h3>Categorías</h3>
            <button class="btn" onclick="cargarJuegos('')">Todos</button>
            <button class="btn" onclick="cargarJuegos('RPG')">RPG</button>
            <button class="btn" onclick="cargarJuegos('Deportes')">Deportes</button>
            <button class="btn" onclick="cargarJuegos('Accion')">Acción</button>
            <button class="btn" onclick="cargarJuegos('Shooter')">Shooter</button>
        </div>

        <!-- ÁREA CENTRAL (VISTA Y CATÁLOGO) -->
        <div class="main">
            <h3>Catálogo de Videojuegos <small style="color: #94a3b8; font-weight: normal;">(Haz clic en una portada para ampliarla)</small></h3>
            <div id="catalogo" class="grid">Cargando datos del servidor...</div>
        </div>
    </div>

    <!-- VENTANA EMERGENTE (MODAL) PARA AMPLIAR JUEGO -->
    <div id="modalJuego" class="modal-fondo" onclick="cerrarModal(event)">
        <div class="modal-contenido" onclick="event.stopPropagation()">
            <button class="modal-cerrar" onclick="cerrarModal()">✕</button>
            <img id="modalImg" class="modal-img" src="" alt="">
            <div class="modal-info">
                <h2 id="modalTitulo" style="margin-top: 0;"></h2>
                <p><strong>Categoría:</strong> <span id="modalCategoria"></span></p>
                <p><strong>Precio:</strong> $<span id="modalPrecio"></span></p>
                <p><strong>Stock disponible:</strong> <span id="modalStock"></span></p>
                <p><strong>Ventas totales:</strong> <span id="modalVentas"></span></p>
                <button id="modalBtnComprar" class="btn">Comprar 1</button>
            </div>
        </div>
    </div>

    <script>
        let juegosGlobales = [];

        async function cargarJuegos(categoria = '') {
            const url = categoria ? `/api/juegos?categoria=${encodeURIComponent(categoria)}` : '/api/juegos';
            const contenedor = document.getElementById('catalogo');
            contenedor.textContent = 'Cargando datos del servidor...';

            try {
                const response = await fetch(url, { headers: { 'Accept': 'application/json' } });
                const datos = await response.json();
                if (!response.ok) throw new Error(datos.message || 'Error al cargar');

                juegosGlobales = datos;
                document.getElementById('buscador').value = '';
                renderizarJuegos(juegosGlobales);

            } catch (error) {
                contenedor.textContent = `Error: ${error.message}`;
            }
        }

        function renderizarJuegos(datos) {
            const contenedor = document.getElementById('catalogo');
            contenedor.replaceChildren();

            if (!datos || datos.length === 0) {
                contenedor.textContent = 'No hay juegos disponibles.';
                return;
            }

            datos.forEach(juego => {
                const tarjeta = document.createElement('div');
                tarjeta.className = 'card';

                const fallbackImg = `https://placehold.co/300x400/1e293b/ffffff?text=${encodeURIComponent(juego.titulo || 'Juego')}`;
                const rutaFinal = juego.imagen || fallbackImg;

                const img = document.createElement('img');
                img.className = 'img-juego';
                img.src = rutaFinal;
                img.alt = `Portada de ${juego.titulo}`;
                img.title = 'Clic para ampliar';
                img.onerror = () => {
                    img.onerror = null;
                    img.src = fallbackImg;
                };
                img.addEventListener('click', () => abrirModal(juego, img.src));
                tarjeta.appendChild(img);

                const titulo = document.createElement('h4');
                titulo.textContent = juego.titulo;
                tarjeta.appendChild(titulo);

                const detalles = [
                    ['Categoría', juego.categoria ?? 'General'],
                    ['Precio', `$${juego.precio ?? 0}`],
                    ['Stock', juego.stock ?? 0],
                    ['Ventas', juego.ventas_totales ?? 0]
                ];

                detalles.forEach(([etiqueta, valor]) => {
                    const parrafo = document.createElement('p');
                    parrafo.style.margin = '3px 0';
                    const fuerte = document.createElement('strong');
                    fuerte.textContent = `${etiqueta}: `;
                    parrafo.append(fuerte, document.createTextNode(String(valor)));
                    tarjeta.appendChild(parrafo);
                });

                const sinStock = (juego.stock ?? 0) < 1;
                const boton = document.createElement('button');
                boton.className = 'btn';
                boton.textContent = sinStock ? 'Agotado' : 'Comprar 1';
                boton.disabled = sinStock;
                boton.addEventListener('click', () => comprar(juego.id));
                tarjeta.appendChild(boton);

                contenedor.appendChild(tarjeta);
            });
        }

        function abrirModal(juego, imgSrc) {
            document.getElementById('modalImg').src = imgSrc;
            document.getElementById('modalImg').alt = `Portada de ${juego.titulo}`;
            document.getElementById('modalTitulo').textContent = juego.titulo;
            document.getElementById('modalCategoria').textContent = juego.categoria ?? 'General';
            document.getElementById('modalPrecio').textContent = juego.precio ?? 0;
            document.getElementById('modalStock').textContent = juego.stock ?? 0;
            document.getElementById('modalVentas').textContent = juego.ventas_totales ?? 0;

            const btnModal = document.getElementById('modalBtnComprar');
            const sinStock = (juego.stock ?? 0) < 1;
            btnModal.textContent = sinStock ? 'Agotado' : 'Comprar 1';
            btnModal.disabled = sinStock;
            btnModal.onclick = async () => {
                await comprar(juego.id);
                cerrarModal();
            };

            document.getElementById('modalJuego').classList.add('activo');
        }

        function cerrarModal() {
            document.getElementById('modalJuego').classList.remove('activo');
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') cerrarModal();
        });

        function buscarJuego() {
            const textoBuscado = document.getElementById('buscador').value.trim().toLowerCase();
            const juegosFiltrados = juegosGlobales.filter(juego =>
                (juego.titulo || '').toLowerCase().includes(textoBuscado)
            );
            renderizarJuegos(juegosFiltrados);
        }

        async function comprar(juegoId) {
            try {
                const response = await fetch('/api/ventas', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ juego_id: juegoId, cantidad: 1 })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.message || 'No fue posible registrar la venta');

                alert('✅ ' + data.message);
                await cargarJuegos();
            } catch (error) {
                alert('❌ ' + error.message);
            }
        }

        cargarJuegos();
    </script>
</body>
</html>
